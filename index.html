<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frase del día</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebee;--ink:#1d2733;--mute:#7b8794;--glow:#cfd9e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1520;--ink:#dde4ec;--mute:#6f7d8c;--glow:#18263a}}
:root[data-theme="dark"]{--bg:#0e1520;--ink:#dde4ec;--mute:#6f7d8c;--glow:#18263a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse 70% 55% at 50% 45%,var(--glow),var(--bg));color:var(--ink);font-family:'Instrument Serif',Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box}
main{max-width:34ch;width:100%;text-align:center;min-height:14rem;display:flex;flex-direction:column;justify-content:center}
blockquote{margin:0;font-size:clamp(1.6rem,4.6vw,2.5rem);line-height:1.28;font-weight:400;text-wrap:balance;opacity:0;transition:opacity 2.2s ease}
cite{display:block;margin-top:1.6rem;font-size:1.05rem;font-style:italic;color:var(--mute);opacity:0;transition:opacity 2.2s ease .9s}
.on blockquote,.on cite{opacity:1}
footer{position:fixed;left:0;right:0;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:1.6rem;font-size:.95rem;color:var(--mute)}
button{all:unset;cursor:pointer;color:var(--mute);transition:color .3s}
button:hover,button:focus-visible{color:var(--ink)}
button:focus-visible{outline:1px solid var(--mute);outline-offset:4px}
@media(prefers-reduced-motion:reduce){blockquote,cite{transition:none}}
</style></head><body>
<main id="m"><blockquote id="q"></blockquote><cite id="a"></cite></main>
<footer><span id="d"></span><button id="r" aria-label="Ver otra frase">otra</button></footer>
<script>
const m=document.getElementById('m');let F=[],cur=0;
function parse(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>3).map(l=>{
 if(/^[“"]/.test(l)){const i=Math.max(l.lastIndexOf('”'),l.lastIndexOf('"'));if(i>0)return[l.slice(1,i).trim(),l.slice(i+1).replace(/^[\s.\-—–]+/,'')]}
 const p=l.split('|');return[p[0].trim(),(p[1]||'').trim()]})}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function show(i){m.classList.remove('on');setTimeout(()=>{q.textContent='“'+F[i][0]+'”';a.textContent=F[i][1]?'— '+F[i][1]:'';void m.offsetWidth;m.classList.add('on')},m.dataset.s?500:50);m.dataset.s=1}
const n=new Date();
d.textContent=n.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
fetch('frases.txt',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
 F=parse(t);if(!F.length)throw 0;
 const r=rng(20261003),O=F.map((_,i)=>i);
 for(let i=O.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[O[i],O[j]]=[O[j],O[i]]}
 const day=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5);
 cur=O[day%F.length];show(cur);
 document.getElementById('r').onclick=()=>{let i;do{i=Math.floor(Math.random()*F.length)}while(i===cur&&F.length>1);cur=i;show(i)};
}).catch(()=>{q.textContent='No se pudo leer frases.txt. Dejalo en la misma carpeta que este archivo y abrilo desde un servidor.';a.textContent='';m.classList.add('on')});
</script></body></html>
